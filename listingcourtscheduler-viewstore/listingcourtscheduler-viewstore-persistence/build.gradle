dependencies {
    api project(':listingcourtscheduler-domain')
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'jakarta.persistence:jakarta.persistence-api'

    implementation 'org.modelmapper:modelmapper:3.2.6'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'commons-collections:commons-collections:3.2.2'
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'org.slf4j:slf4j-api'

    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen:7.4.5.Final'
}

// Repository tests share a single @SpringBootConfiguration but each test class still
// holds its own Hikari pool (per Spring application context, since the @DataJpaTest
// slice creates a fresh context per class). Running them in a single forked JVM and
// letting Spring's TestContext cache reuse contexts keeps the total open Postgres
// connections well under the default 100-connection ceiling.
test {
    maxParallelForks = 1
    forkEvery = 0  // 0 = no JVM-restart per N test classes; reuse the JVM/context cache
}

dependencies {

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.github.benas:random-beans:3.9.0'
    testImplementation 'com.google.guava:guava:33.6.0-jre'
    testImplementation 'org.apache.commons:commons-io:1.3.2'
    // Repository tests run via @DataJpaTest against Postgres in a container so that
    // the JPA criteria queries are exercised on the same dialect we use in prod.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    // Spring Boot 4 split @DataJpaTest / @AutoConfigureTestDatabase out into per-slice modules
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.postgresql:postgresql'
    testImplementation 'org.liquibase:liquibase-core'
    testImplementation 'org.springframework.boot:spring-boot-liquibase'
    testRuntimeOnly project(':listingcourtscheduler-viewstore:listingcourtscheduler-viewstore-liquibase')
}
