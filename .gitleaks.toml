title = "cpp-context-listing-courtscheduler gitleaks config"

# Extend gitleaks' built-in ruleset (catches Azure storage keys, generic high-entropy
# base64, GitHub tokens, etc.) and layer on project-specific overrides below.
[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Project-specific rule: Azure Storage connection-string format
# Catches `AccountKey=<88-char base64>` literals even when the built-in
# azure-storage-account-key pattern misses a variant encoding.
# ---------------------------------------------------------------------------
[[rules]]
id          = "azure-storage-account-key-in-connection-string"
description = "Azure Storage account key embedded in a connection-string literal"
regex       = '''AccountKey=[A-Za-z0-9+/]{86}=='''
tags        = ["key", "azure", "storage"]

  [[rules.allowlists]]
  description = """
    Azurite well-known development account key.
    This is a fixed, publicly documented non-secret that ships with every
    Azurite release: https://github.com/Azure/Azurite#default-storage-account
    It has no access to any real Azure resource.
  """
  regexes = [
      # Azurite default key — intentionally hardcoded, not a real credential
      "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
  ]

# ---------------------------------------------------------------------------
# Global allowlist
# ---------------------------------------------------------------------------
[allowlist]
description = "Repo-wide allowlists"
regexes = [
    # Azurite well-known dev key — not a secret (see rule allowlist above)
    "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
]
