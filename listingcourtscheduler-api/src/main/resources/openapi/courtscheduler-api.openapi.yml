        durationInMinutes: { type: integer, default: 0 }
        source: { type: string, nullable: true }
        ouCode: { type: string, nullable: true }
        courtCentreName: { type: string, nullable: true }
        courtRoomName: { type: string, nullable: true }

    MagsSearchAndBookRequest:
      type: object
      properties:
        hearingId: { type: string, nullable: true }
        courtCentreId: { type: string, nullable: true }
        courtRoomId: { type: string, nullable: true }
        hearingDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        hearingStartTime: { type: string, nullable: true }
        hearingSessionDateSearchCutOff: { type: string, nullable: true }
