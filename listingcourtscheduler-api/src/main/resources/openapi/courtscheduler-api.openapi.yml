        endDate: { type: string, format: date, nullable: true }
        earliestHearingTime: { type: string, nullable: true }
        durationInMinutes: { type: integer, default: 0 }
        courtScheduleId: { type: string, nullable: true }
        source: { type: string, nullable: true }
        ouCode: { type: string, nullable: true }
        courtCentreName: { type: string, nullable: true }
        courtRoomName: { type: string, nullable: true }

    # Single-day CROWN fallback search-and-book (SlotsUpdateService#crownFallbackSearchAndBook) —
    # internal only, not part of postSearchAndBookHearing's polymorphic set.
