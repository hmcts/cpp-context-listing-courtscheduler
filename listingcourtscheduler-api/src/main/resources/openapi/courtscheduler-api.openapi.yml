    # postSearchAndBookHearing (/hearings/{hearingId}) is polymorphic by Content-Type — four
    # request media types share one operationId/Java method, so all four Courtscheduler* aliases
    # below MUST stay PassthroughObject (Map<String,Object>) or the generated interface collapses
    # to a single Java parameter type and breaks the other three Content-Types. These four request
    # schemas are standalone — CourtSchedulerApi's per-Content-Type private handlers hand-construct
    # them field-by-field from the JsonObject payload.
    CrownSearchAndBookRequest:
      type: object
      properties:
        hearingId: { type: string, nullable: true }
        courtCentreId: { type: string, nullable: true }
        courtRoomId: { type: string, nullable: true }
