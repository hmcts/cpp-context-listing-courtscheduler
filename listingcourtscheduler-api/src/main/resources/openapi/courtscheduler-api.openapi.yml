      properties:
        ruleId: { type: string, nullable: true }
        judiciaryId: { type: string, nullable: true }
        courtHouseId: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        repeatDays:
          type: array
          nullable: true
          items: { type: string }
        sessionType: { type: string, nullable: true }
        unavailabilities:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/JudiciaryUnavailabilityRequest' }

    UpdateJudiciaryAvailabilityRuleRequest:
      type: object
      properties:
        ruleId: { type: string, nullable: true }
        judiciaryId: { type: string, nullable: true }
        courtHouseId: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        repeatDays:
          type: array
          nullable: true
          items: { type: string }
        sessionType: { type: string, nullable: true }
        unavailabilities:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/JudiciaryUnavailabilityRequest' }

    DeleteJudiciaryAvailabilityRuleRequest:
      type: object
      properties:
        ruleId: { type: string, nullable: true }
        judiciaryId: { type: string, nullable: true }
