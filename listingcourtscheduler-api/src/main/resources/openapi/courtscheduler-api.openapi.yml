        endDate: { type: string, format: date, nullable: true }

    FindJudiciaryAvailabilityRequest:
      type: object
      properties:
        ruleId: { type: string, nullable: true }
        judiciaryId: { type: string, nullable: true }
        courtHouseId: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }

    FindJudiciaryAvailabilityRuleRequest:
      type: object
      properties:
        ruleId: { type: string, nullable: true }
        judiciaryId: { type: string, nullable: true }
        courtHouseId: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        pageSize: { type: integer, nullable: true }
        pageNumber: { type: integer, nullable: true }
        withJudiciary: { type: boolean, nullable: true }

    GetJudiciaryAvailabilityRuleRequest:
      type: object
      properties:
        ruleId: { type: string, nullable: true }
        withJudiciary: { type: boolean, nullable: true }

    FindJudiciaryAvailabilityResponse:
      type: object
      properties:
        availableJudiciaries:
          type: array
          nullable: true
          items: { type: string }

    JudiciaryUnavailabilityRequest:
      type: object
      properties:
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        reason: { type: string, nullable: true }

    JudiciaryUnavailabilityResponse:
      type: object
      properties:
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        reason: { type: string, nullable: true }

    JudiciaryAvailabilityRuleResponse:
      type: object
      properties:
        id: { type: string, nullable: true }
        judiciaryId: { type: string, nullable: true }
        courtHouseId: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        repeatDays:
          type: array
          nullable: true
          items: { type: string }
        sessionType: { type: string, nullable: true }
        unavailabilities:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/JudiciaryUnavailabilityResponse' }

    # --- Hearing-slot / booking family (standalone; the endpoints below stay PassthroughObject —
