# Datasource, JPA and Liquibase
spring:
  datasource:
    url: ${COURTSCHEDULER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scsl}
    username: ${COURTSCHEDULER_DATASOURCE_USERNAME:scsl}
    password: ${COURTSCHEDULER_DATASOURCE_PASSWORD:scsl}
    driver-class-name: ${COURTSCHEDULER_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: cp-hikari
      maximum-pool-size: ${COURTSCHEDULER_DB_POOL_SIZE:20}
      minimum-idle: ${COURTSCHEDULER_DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      validation-timeout: 5000
      auto-commit: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.connection.provider_disables_autocommit: true
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  sql:
    init:
      mode: never

  liquibase:
    enabled: true
    change-log: classpath:liquibase/courtscheduler-view-store-db-changelog.xml
