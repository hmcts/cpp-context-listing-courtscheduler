name: Build and Publish (Non-Release)

on:
  # Run on every PR regardless of target branch — gating of publish/docker/deploy
  # is done by the `is_publish` / `trigger_docker` / `trigger_deploy` inputs below
  # which are conditional on `github.event_name == 'push'`.
  pull_request:
  push:
    branches:
      - master
      - main
      - 'dev/*'
      - 'team/*'

jobs:
  ci-draft:
    uses: ./.github/workflows/ci-build-publish.yml
    secrets:
      AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
      AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
      HMCTS_ADO_PAT: ${{ secrets.HMCTS_CP_ADO_PAT }}
    with:
      environment: dev
      # Publish / build-image / deploy only AFTER a merge — i.e. a push to a
      # merge-target branch (main, master, team/*). Pull requests and pushes to
      # dev/* feature branches run build + unit + integration tests only: no
      # image is built, nothing is published, nothing is deployed.
      is_publish: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/team/')) }}
      trigger_docker: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/team/')) }}
      trigger_deploy: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/team/')) }}
