name: CodeQL

on:
  pull_request:

  schedule:
    - cron: '36 5 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
        language: ['java']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Gradle Build (skip tests + IT)
        # `-x test` excludes the `test` task in every subproject, including the
        # integration-test module, so CodeQL doesn't pull docker compose during
        # the build phase.
        run: |
          ./gradlew build cyclonedxBom -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

      - name: Log generated SBOM Hash
        run: |
          for f in listingcourtscheduler-api/build/reports/bom.json listingcourtscheduler-api/build/reports/bom.xml; do
            [ -f "$f" ] && sha256sum "$f" || true
          done

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            listingcourtscheduler-api/build/reports/bom.json
            listingcourtscheduler-api/build/reports/bom.xml
          if-no-files-found: ignore

  DAST:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Build bootJar (skip tests + IT)
        run: ./gradlew :listingcourtscheduler-api:bootJar -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: DAST – bring the IT stack up
        # Re-uses the IT compose stack (api + postgres + wiremock + azurite)
        # so the running app has the same dependencies it would have under
        # integration tests. Gradle's `composeUp` builds and waits for health.
        run: |
          ./gradlew :listingcourtscheduler-integration-test:composeUp --no-daemon

          echo "Waiting for app health endpoint…"
          for i in {1..30}; do
            if curl -fsS http://localhost:8083/listingcourtscheduler-api/rest/courtscheduler/actuator/health > /dev/null; then
              echo "App is healthy"
              break
            fi
            echo "Waiting for app to be healthy ($i)…"
            sleep 2
          done

      - name: Run OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8083/listingcourtscheduler-api/rest/courtscheduler"
          cmd_options: "-a -J zap_report.json -r zap_report.html"

      - name: Upload ZAP HTML Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-html-report
          path: zap_report.html

      - name: Tear down compose stack
        if: always()
        run: ./gradlew :listingcourtscheduler-integration-test:composeDown --no-daemon || true
