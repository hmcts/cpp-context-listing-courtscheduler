## 2. Executive summary

The **Court Scheduler** is the Common Platform service that manages **court sitting capacity**. It records when and where courts sit, what kind of work each sitting can take, which judges or magistrates sit there, and how much of that capacity is already booked by hearings.

**What it does for the business**

| Capability | What it means in practice |
|---|---|
| **Court schedule (session) management** | Listing officers create, edit, delete and query court sessions (morning, afternoon or all-day) for a courtroom. Sessions can be one-off or repeat weekly. |
| **Hearing slot booking** | Hearings are booked into sessions, either by number of slots or by minutes of court time. The service tracks how much capacity is left. |
| **Search for available capacity** | Listing systems search for sessions with free capacity by court, date range, panel (adult/youth), business type and session type. |
| **Provisional bookings** | Capacity can be held provisionally before a hearing is confirmed. |
| **Judiciary assignment** | Judges and magistrates are linked to sessions, either manually or from rota files. |
| **Judicial itineraries (availability rules)** | Records when a judge is available at a court centre (date range, weekdays, AM/PM/all-day) and when they are unavailable (training, annual leave, official business, sick leave). |
| **Rota file ingestion** | Magistrates' court rota files (XML) dropped into Azure Blob Storage are processed automatically to create and update sessions and judiciary assignments. |
| **Move hearing to a past date** | Records a hearing that actually took place in the past against the right historic session(s). |
| **Management information (MI)** | Exports of sessions, judiciary assignments and allocated listings for reporting. |

**Key facts**

- It is a back-end REST service. Users reach it through the Common Platform listing UI and other services, not directly.
- It supports both **Magistrates'** and **Crown** jurisdictions. Crown sessions can be created as **draft** (no courtroom yet) and have a courtroom assigned later.
- It was recently **re-platformed** from WildFly/Java EE to Spring Boot. The guiding principle was *no change for clients*: every URL, media type, status code and response shape was kept.

## 3. Glossary

| Term | Meaning |
|---|---|
| **Court schedule / session** | One sitting of one courtroom on one date (AM, PM or all day). Stored in the `court_schedule` table. |
| **Session type / court session** | `AM` (morning), `PM` (afternoon) or `AD` (all day). |
| **Panel** | `ADULT` or `YOUTH`, the type of defendant the session hears. |
| **Business type** | The kind of court work, e.g. remand or trial. Reference data decides whether it is **slot-based** or **duration-based**, and which jurisdiction it belongs to. |
| **Slot-based** | Capacity is a number of hearings (`max_slot`). Each hearing uses one slot. |
| **Duration-based** | Capacity is minutes of court time (`max_duration_mins`). Each hearing uses its duration. |
| **All-day split (AD split)** | A duration-based all-day session whose capacity is split into separate morning and afternoon budgets around the **national break time** (lunch). |
| **Allocated listing** | A hearing booked into a session (`allocated_listings` table). |
| **Overbooking** | Booking beyond a session's capacity. Only allowed when the session's `is_overbooking_allowed` flag is set. |
| **Provisional booking** | A tentative hold on one or more sessions, identified by a `bookingId`. |
| **Draft session** | A Crown session that has no confirmed courtroom yet. A courtroom is assigned later via `assign.courtroom`. |
| **Jurisdiction** | `MAGISTRATES` (the default) or `CROWN`. |
| **OU code** | Organisation Unit code that identifies a court/location in reference data. |
| **Court centre / court house** | A court building. A court centre contains courtrooms. |
| **Rota / rota file** | An XML file from the magistrates' rota system describing who sits where and when. Full files are prefixed `lja_`. |
| **Listing profile** | The rota's identifier for a session template (`court_listing_profile_id`). |
| **Migrated OU code** | An OU code whose rota data is handled by the newer processing path (`courtscheduler_migration_status` table). |
| **Judicial itinerary / availability rule** | When a judiciary member is available at a court house: date range, weekdays and session type. |
| **Unavailability** | A period inside an itinerary when the judge is not available (training, annual leave, official business, sick leave). |
| **MI** | Management Information: reporting exports. |
| **Envelope / `_metadata`** | A wrapper the legacy framework added to responses. It is kept for client compatibility. |
| **CJSCPPUID** | HTTP header carrying the calling user's ID. It is used for permission checks. |
| **Vendor media type** | Content types like `application/vnd.courtscheduler.create+json`. They identify *which action* a request performs. |

### 5.2 Session types and time windows

Each session type has a permitted time window. All-day sessions can optionally split capacity around the national break time.

```mermaid
gantt
    title Permitted session time windows (one day)
    dateFormat HH:mm
    axisFormat %H:%M

    AM window 01.00 to 13.00        :a1, 01:00, 12h
    section PM
    PM window 14.00 to 23.59        :a2, 14:00, 599m
    section AD
    All-day window 01.00 to 23.59   :a3, 01:00, 1379m
```

### 5.3 Slot-based vs duration-based capacity

```mermaid
flowchart LR
    BT[Business type<br/>from reference data] --> Q{Slot-based?}
    Q -->|Yes| S[Capacity = max_slot<br/>each hearing uses 1 slot]
    Q -->|No| D[Capacity = max_duration_mins<br/>each hearing uses its duration]
    D --> AD{AD session with<br/>all-day split?}
    AD -->|Yes| SPLIT[Separate morning and afternoon budgets<br/>split at national break time]
    AD -->|No| SINGLE[Single minutes budget]
```

### 5.4 Jurisdictions and draft sessions

| | Magistrates | Crown |
|---|---|---|
| On create requests | `jurisdiction` is required (schema), and `panel` is required | `jurisdiction` is required, and `isDraft` is required |
| Default for stored data with no value | Yes, treated as MAGISTRATES | n/a |
| Courtroom source | Rota court-room reference data | Common Platform court-room reference data |
| Created from rota files? | Yes | No |
| Draft sessions | No | Yes, a session can be created as draft and get a courtroom later |
| `assign.courtroom` endpoint | Not allowed | Allowed for draft sessions with no hearings booked |
| Can jurisdiction change on edit? | No | No |

## 6. Business rules

> These rules are enforced by validators and services in `listingcourtscheduler-api` (`api/validator`, `api/service`) and `listingcourtscheduler-common` (`SessionsService`). A validation failure returns **400** with `{"error":"<message>"}` unless stated otherwise.

### 6.1 Session time rules

| Session | Rule |
|---|---|
| **AM** | Start no earlier than 01:00. End no later than 13:00. |
| **PM** | Start no earlier than 14:00. End no later than 23:59. |
| **AD** | Start no earlier than 01:00. End no later than 23:59. |
| All | Start time must be before end time. |
| AD | The all-day split flag must be sent for AD sessions. Example error: *"All day split flag should be sent for All Day(AD) session"*. |

### 6.2 Conflict rules (create and rota)

For the same **OU code + business type + session date + courtroom**:

```mermaid
flowchart TD
    N[New session] --> P{Opposite panel exists?<br/>ADULT vs YOUTH}
    P -->|Yes| R1[Rejected / not persisted]
    P -->|No| T{Session-type clash?<br/>AD vs AM/PM}
    T -->|Yes| R2[Rejected / not persisted]
    T -->|No| D{Exact duplicate?<br/>centre, room, business type,<br/>date, session type, panel}
    D -->|Yes| R3[Rejected as duplicate]
    D -->|No| M{Valid business type and<br/>courtroom mapping?}
    M -->|No| R4[Skipped / error]
    M -->|Yes| OK[Persisted]
```

- **ADULT and YOUTH are mutually exclusive.** If an ADULT session exists, a YOUTH one is not persisted, and the other way round.
- **AD and AM/PM are mutually exclusive.** An all-day session cannot coexist with AM or PM sessions in the same room on the same day.

### 6.3 Repeat patterns (create)

| Frequency | Behaviour |
|---|---|
| `ONCE` | One session on `startDate`. |
| `EVERY_WEEK` | Sessions on the selected `repeatDays` between `startDate` and `endDate` (required), every `repeatFor` weeks. |
| `EVERY_MONTH` | Monthly repeat between `startDate` and `endDate` (required). For CROWN sessions, `index` (1–5) is required: the occurrence of the weekday within the month. |

Other create rules:

- `startDate` cannot be in the past, and `endDate` cannot be before `startDate`.
- `jurisdiction` is required on every session. **CROWN** sessions must send `isDraft`. **MAGISTRATES** sessions must send `panel`.

### 6.4 Update (edit) restrictions

```mermaid
flowchart TD
    U[Edit request] --> J{Jurisdiction changed?}
    J -->|Yes| X1["Error: Jurisdiction cannot be changed"]
    J -->|No| BT{Business type jurisdiction<br/>matches session jurisdiction?}
    BT -->|No| X2[Error: business type jurisdiction mismatch]
    BT -->|Yes| SD{Slot-based to duration-based<br/>or the reverse?}
    SD -->|Yes| X3[Error: cannot switch capacity model]
    SD -->|No| H{Hearings booked?}
    H -->|Yes| HB{Changing room, session type<br/>or panel?}
    HB -->|Yes| X4[Error: hearings already booked]
    HB -->|No| TM{New start after earliest hearing<br/>or new end before latest hearing?}
    TM -->|Yes| X5[Error: time change conflicts with hearings]
    TM -->|No| OK[Update and recalculate availability]
    H -->|No| AS{allDaySplit already set<br/>and being changed?}
    AS -->|Yes| X6[Error]
    AS -->|No| OK
```

### 6.5 Delete rules

- Only sessions **without allocated hearings** can be deleted.
- The response lists sessions that could **not** be deleted, with a reason for each.

### 6.6 Assign courtroom (Crown draft sessions)

```mermaid
flowchart TD
    A[assign.courtroom request<br/>courtScheduleIds + courtRoomId] --> F{Session found?}
    F -->|No| E1[Session not found]
    F -->|Yes| C{Jurisdiction = CROWN?}
    C -->|No| E2[Only valid for CROWN sessions]
    C -->|Yes| CC{Courtroom in the same<br/>court centre?}
    CC -->|No| E3[Courtroom must belong to the same court centre]
    CC -->|Yes| DUP{Duplicate session in<br/>target room?}
    DUP -->|Yes| E4[Duplicate session already exists]
    DUP -->|No| DR{Is draft?}
    DR -->|No, already assigned| E5[Cannot assign courtroom to an assigned session]
    DR -->|Yes| HB{Hearings booked?}
    HB -->|Yes| E6[Cannot assign to a draft session with hearings]
    HB -->|No| OK[Courtroom assigned, isDraft = false]
```

Each session is evaluated independently. The response reports successes and per-session errors.

### 6.7 Booking and overbooking

- A booking succeeds only if the session has free capacity (slots or minutes), **unless** `isOverbookingAllowed` is true for that session.
- Searches can include overbooked sessions with `showOverbookedSlots=true`.
- Re-booking a hearing releases its previous allocation first.

### 6.8 Move hearing to a past date

`POST /hearings/{hearingId}` records a hearing against historic session(s).

| Rule | Detail |
|---|---|
| No future dates | `startTime` or `endTime` after today (UTC) → **422** `FUTURE_DATE_NOT_ALLOWED`. |
| Jurisdiction | `MAGISTRATES` (default) or `CROWN`. |
| Session search | For each sitting day, finds a matching active session at `courtCentreId` (optionally a specific `courtRoomId`) whose time window contains the hearing time. |
| Sitting days | Weekdays in the range. Weekends in the middle of a mixed range are skipped. A range made only of weekend days (e.g. a single Saturday) is used as given, because weekend sessions exist (e.g. Saturday remand courts). |
| Duration | Single day: the minutes between `startTime` and `endTime`. Multi-day: a full court day per sitting day. |
| All-or-nothing | If **any** day has no matching session, nothing is booked → **422** `NO_SESSION_FOUND`. |
| Source | Allocations are marked `source = MOVE_TO_PAST_DATE`. Earlier allocations for the hearing are released. |

```mermaid
flowchart TD
    R[Request: start/end instants, court centre,<br/>optional room, jurisdiction] --> FD{Any date after today?}
    FD -->|Yes| E1[422 FUTURE_DATE_NOT_ALLOWED]
    FD -->|No| SD[Expand range into sitting days]
    SD --> LOOP{For every day:<br/>matching session found?}
    LOOP -->|No for any day| E2[422 NO_SESSION_FOUND<br/>nothing written]

### 6.9 Judicial itineraries (availability rules)

Validation failures return **422** with `{"validationResult":{"status":"FAILURE","validationError":"<message>"}}`.

| Area | Rules (messages as shown to users) |
|---|---|
| Required fields | *Select a judiciary*, *Select a courthouse*, *Enter a start date*, *Enter an end date*, *Select the days you want to repeat* |
| Date range | *The start date must be the same as or before the end date*; *The date range must be 3 years or less*; start and end dates must be in the future |
| Repeat days | Monday to Friday only |
| Session type | `AM`, `PM` or `AD` |
| Unavailability | Reasons: `TRAINING`, `ANNUAL_LEAVE`, `OFFICIAL_BUSINESS`, `SICK_LEAVE`. Dates must sit inside the itinerary. Periods cannot overlap. Adding one that affects already-assigned sessions is flagged for review. |
| Clashes | *The judiciary is already assigned during these dates* |
| Update | Changing the start or end date in a way that affects assigned sessions is flagged with a count of affected sessions. |
| Delete | *You cannot delete this itinerary because it is being used in a session.* |

```mermaid
flowchart LR
    UI[UI] -->|validate-add / validate-update / validate-delete| V{Valid?}
    V -->|No| F[422 validationResult FAILURE<br/>shown to user]
    V -->|Yes| S[200 SUCCESS]
    S --> UI2[User confirms] -->|add / update / delete| P[(judiciary_availability_rule<br/>+ unavailability)]
```

## 8. Rota file processing

**In plain language:** the magistrates' rota team publishes XML files describing which courtrooms sit, when, for what business, and with which magistrates or judges. The Court Scheduler reads these files from Azure Blob Storage and turns them into sessions and judiciary assignments. It then archives the files.

### 8.1 File types

| Type | How it is recognised | Behaviour |
|---|---|---|
| **Full rota file** | Name starts `lja_` | Replaces the sessions for the rota period: creates, updates and deactivates. |
| **Snapshot file** | Name contains `_snapshot_` and a timestamp | Incremental update. Skipped if a newer snapshot has already been processed. |
| **Dummy support file** | Name contains `dummysupport` | Skipped. |
| **IT test file** | Name starts `IT_Test_` (only when `forItTest=true`) | Used by integration tests. |

### 8.2 End-to-end flow

```mermaid
flowchart TD
    T[POST /rotasl/process-rota-files<br/>returns 202 immediately] --> A[[Async worker]]
    A --> F{Unleased file with prefix<br/>lja_ or IT_Test_?}
    F -->|No| DONE[Finish]
    F -->|Yes| L[Acquire blob lease]
    L --> RD{Reference data loaded<br/>this run?}
    RD -->|No| LOAD[Load court rooms, judiciaries,<br/>room session allocations, business types]
    RD -->|Yes| DL
    LOAD --> DL[Download blob]
    DL --> P{rotaProcess = old?}
    P -->|Yes| OLD[Legacy RotaFileProcessorService]
    P -->|No, default| NEW[New RotaFileProcessor]
    NEW --> PARSE[Parse XML, create execution ID,<br/>record rota_file_process_history]
    PARSE --> SNAP{Snapshot older than<br/>last processed?}
    SNAP -->|Yes| SKIP[Skip file]
    SNAP -->|No| ENR[Map location to OU code,<br/>work out rota period,<br/>resolve business types]
    ENR --> CLEAN[Delete unallocated judiciary<br/>for rota period]
    CLEAN --> SCHED[Create / update / deactivate<br/>court_schedule rows]
    SCHED --> JUD[Assign judiciary to sessions]
    JUD --> PROV[Populate provisional forecast data<br/>default 6 months, 28-day cycle]
    PROV --> ARCH[Archive file, release lease,<br/>delete from input container]
    OLD --> ARCH
    SKIP --> ARCH
    ARCH --> F
```

### 8.3 Processing sequence

```mermaid
sequenceDiagram
    autonumber
    participant Sch as Scheduler / ops
    participant API as RotaFileProcessorApi
    participant Trig as Trigger service (@Async)
    participant Blob as Azure Blob Storage
    participant RD as Reference Data
    participant Proc as RotaFileProcessor
    participant DB as PostgreSQL

    Sch->>API: POST /rotasl/process-rota-files {forItTest?, rotaProcess?}
    API->>Trig: captureRotaFilesAndProcessEach()
    API-->>Sch: 202 Accepted
    loop until no unleased file remains
        Trig->>Blob: findAvailableFile(prefix) + lease
        Trig->>RD: load reference data (first file only)
        Trig->>Blob: download
        Trig->>Proc: downloadAndProcessForEachFile(content, name, leaseId)
        Proc->>DB: history, sessions, judiciary, provisional data
        Proc->>DB: rota_process_log (errors)
        Proc->>Blob: archive + delete input file
    end
```

### 8.4 Rota blob state

```mermaid
stateDiagram-v2
    [*] --> Waiting : file uploaded to input container
    Waiting --> Leased : worker acquires lease
    Leased --> Waiting : lease conflict (another worker), skip
    Leased --> Processing
    Processing --> Archived : success or skipped snapshot
    Processing --> Waiting : error, lease released
    Archived --> [*] : copied to archive, removed from input
```

### 8.5 Migrated vs non-migrated OU codes

`POST /oucode/migrate` sets each OU code's flag in `courtscheduler_migration_status`. During rota processing, migrated and non-migrated OU codes are processed separately: the existing sessions for the rota period are compared with the file, and sessions are created, updated or deactivated as needed.

### 8.6 Housekeeping

- `POST /rotasl/clean-redundant-rota-data` with `{"numberOfPreviousMonthsAndOlder": N}` deletes rota-derived data older than *N* months. It returns 202.
- Errors per execution are recorded in `rota_process_log`. Each processed file is recorded in `rota_file_process_history` (with a file hash and execution ID).

## 9. Availability calculation

Availability is always **derived from the bookings**, so it can be recalculated at any time (`POST /oucode/recalculate-availability`).

| Model | Formula |
|---|---|
| Slot-based | `available_slot = max_slot − count(allocated_listings)` |
| Duration-based | `available_duration_mins = max_duration_mins − Σ allocated_listings.duration` |
| AD split, morning | `Σ` minutes of each hearing that fall **before** `national_break_time` |
| AD split, afternoon | `Σ` minutes of each hearing that fall **at or after** `national_break_time` |

A hearing that spans the break is split: the minutes before the break count against the morning budget and the rest against the afternoon.

```mermaid
gantt
    title Example AD split session, break at 13:00
    dateFormat HH:mm
    axisFormat %H:%M
    section Budgets
    Morning budget (180 min)      :m, 10:00, 180m
    Lunch break                   :crit, b, 13:00, 60m
    Afternoon budget (150 min)    :a, 14:00, 150m
    section Hearings
    H1 60 min (morning)           :h1, 10:00, 60m
    H2 120 min spans break        :h2, 12:00, 120m
    H3 30 min (afternoon)         :h3, 14:30, 30m
```

*Worked example:* H1 uses 60 morning minutes. H2 starts at 12:00, so its first 60 minutes count as morning and its remaining 60 as afternoon. H3 uses 30 afternoon minutes. Total booked: morning 120 of 180, afternoon 90 of 150.

## 11. API reference

### 11.1 Conventions

| Aspect | Convention |
|---|---|
| Context path | `/listingcourtscheduler-api/rest/courtscheduler` |
| Contract | `listingcourtscheduler-api/src/main/resources/openapi/courtscheduler-api.openapi.yml` (generated from the legacy RAML) |

    BV -->|Fails| S400b[400 error / 422 for<br/>judiciary and past-date]
    BV -->|OK| T{Operation type}
    T -->|create / edit / session / oucode /<br/>rota / delete hearing| S202[202]
    T -->|query / book / delete / MI /<br/>provisional / assign courtroom| S200[200]
    T -->|searchupdate| S204[204]
    T -.unexpected exception.-> S500[500 error]
```

## 12. Security: authentication, authorisation and audit

### 12.1 Authorisation flow

There is no Spring Security. Authorisation is handled by `cp-auth-rules-filter`, which evaluates Drools rules against the caller's permissions fetched from the Users & Groups service.

```mermaid
sequenceDiagram
    participant C as Client
    participant F as cp-auth-rules-filter
    participant UG as Users & Groups
    participant D as Drools rules<br/>courtscheduler-api.drl
    participant APP as API

    C->>F: request + CJSCPPUID (+ optional CPP-ACTION)
    F->>F: Resolve action name
    F->>UG: GET logged-in-user/permissions (CJSCPPUID)
    UG-->>F: permissions
    F->>D: evaluate(Action, user permissions)
    alt rule grants
        D-->>F: Outcome success
        F->>APP: continue
        APP-->>C: response
    else no matching rule / denied
        F-->>C: 403 Forbidden
    end
```

### 12.2 How the action name is resolved

```mermaid
flowchart TD
    Q[Incoming request] --> H{CPP-ACTION header?}
    H -->|Yes| A1[Action = header value]
    H -->|No| V{Vendor media type?<br/>application/vnd.TOKEN+json}
    V -->|Yes| A2[Action = TOKEN<br/>e.g. courtscheduler.create]
    V -->|No| A3["Action = METHOD PATH<br/>e.g. GET /judiciaries/availability"]
    A1 & A2 & A3 --> R{Matching Drools rule<br/>and user has permission?}
    R -->|Yes| OK[Allowed]
    R -->|No| NO[Denied, fails closed]
```

Key settings (`application-authz.yml`): `action-required: false`, `deny-when-no-rules: true`. `/actuator`, `/error` and `/usersgroups-query-api/` are excluded. Authorisation is switched on by `CSCHED_AUTHZ_ENABLED`.

> **Developers:** every new endpoint needs a rule in `src/main/resources/uk.gov.moj.cpp.courtscheduler.api.accesscontrol.drl/courtscheduler-api.drl`. Without one, it returns 403.

### 12.3 Audit and outbound identity

- `cp-audit-filter-springboot` (configured by `AuditFilterConfig`, driven by the OpenAPI spec) records an audit event per request. It is toggled by `CSCHED_HTTP_AUDIT_ENABLED` / `CSCHED_AUDIT_ENABLED`.
- Outbound calls to Reference Data and Users & Groups are made as the **system user** (`COURTSCHEDULER_SYSTEM_USER_ID`) in the `CJSCPPUID` header.
- Azure Blob Storage is accessed with **Workload Identity / DefaultAzureCredential** in Azure, or a connection string locally and in tests.

### 16.4 Adding or changing an endpoint

```mermaid
flowchart TD
    S[New / changed endpoint] --> O[1. Edit OpenAPI spec<br/>courtscheduler-api.openapi.yml]
    O --> G[2. Build: generator creates *OpenApi interface]
    G --> C[3. Implement in the API class<br/>api/*Api.java]
    C --> SC[4. Add JSON schema in src/raml/json/schema<br/>if a vendor +json request body]
    SC --> D[5. Add Drools rule in courtscheduler-api.drl]
    D --> V[6. Validators + service logic]
    V --> P{Writes to DB?}
    P -->|Yes| T[7. Method-level @Transactional<br/>on new repository write methods]
    P -->|No| U
    T --> U[8. Unit tests + IT in integration-test module]
    U --> K[9. Confirm envelope + error shape<br/>match legacy contract]
```

### 16.5 Things that will trip you up

| Topic | What to know |
|---|---|
| **Client compatibility** | The service must stay a drop-in replacement for the legacy one. Do not change error shapes (`{"error":…}`), status codes or media types. |
| **Transactions** | `CourtScheduleRepositoryImpl` is `@Transactional(readOnly = true)` at class level. Any new **writing** method needs its own `@Transactional`, otherwise you get `TransactionRequiredException` at runtime. |
| **Upserts** | Batch inserts run in `CourtScheduleBatchInsertService.persistBatch` (`REQUIRES_NEW`). Flushing inside the caller's transaction poisons it (rollback-only), which surfaces as HTTP 500. |
| **Repository style** | Use the declarative Spring Data `@Query` style with `default` alias methods (`findBy`, `merge`, `remove`). Only `CourtScheduleRepository` has a custom `Impl`. |
| **Time zones** | Some logic uses `Europe/London`, while JDBC uses UTC. Tests pin `Europe/London`. |
| **Generated code** | OpenAPI interfaces are in `build/generated/openapi`. Do not edit them. |
| **Schemas** | Many OpenAPI schemas are permissive `PassthroughObject`s. Real request validation is done by the RAML JSON schemas via `RequestSchemaValidationFilter`. |
| **Rota processing is async** | `POST /rotasl/process-rota-files` returns before any processing. Tests must poll (Awaitility / `RestPoller`). |

### 16.6 Source layout

```
listingcourtscheduler-api/src/main/java/uk/gov/moj/cpp/courtscheduler/
├── Application.java
├── api/                 # *Api classes (controllers), validators, converters, services, rota

### 17.5 Defect triage tips

- Capture the **request media type**, the `CJSCPPUID` and the full response body. The media type decides which code path runs.
- For rota issues, capture the **blob name** and the **execution ID** from the logs.
- If an error body is not `{"error":…}`, treat it as a **contract regression**: the legacy behaviour is the baseline.

  };

  const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const slug = text => text.trim().toLowerCase()
      .replace(/<[^>]+>/g, '')
      .replace(/[^\p{L}\p{N}\s-]/gu, '')
      .replace(/\s/g, '-');

  const mdText = document.getElementById('md-source').textContent.replace(/<\\\/script/g, '</script');
  const diagrams = [];

  const renderer = new marked.Renderer();
  const baseCode = renderer.code.bind(renderer);
  renderer.code = function (code, lang, escaped) {
    if ((lang || '').trim() === 'mermaid') {
      diagrams.push(code);
      return '<div class="diagram"><pre class="mermaid" data-idx="' + (diagrams.length - 1) + '">' +
             escapeHtml(code) + '</pre></div>';
    }
    return baseCode(code, lang, escaped);
  };
  renderer.table = function (header, body) {
    return '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + body + '</tbody></table></div>';
  };

  const content = document.getElementById('content');
  content.innerHTML = marked.parse(mdText, { renderer: renderer, gfm: true });
  content.insertAdjacentHTML('beforeend',
    '<p class="footer">Generated from <code>doc/COURT_SCHEDULER_GUIDE.md</code>. Edit the Markdown, then run <code>python3 doc/build_html.py</code> to regenerate this file.</p>');

  // Heading ids (GitHub-style) and TOC.
  const tocList = document.getElementById('tocList');
  const used = {};
  content.querySelectorAll('h1, h2, h3').forEach(h => {
    let id = slug(h.textContent);
    if (used[id] !== undefined) { used[id] += 1; id = id + '-' + used[id]; } else { used[id] = 0; }
    h.id = id;
    if (h.tagName === 'H1') return;
    const li = document.createElement('li');
    if (h.tagName === 'H3') li.className = 'sub';
    const a = document.createElement('a');
    a.href = '#' + id; a.textContent = h.textContent;
    li.appendChild(a); tocList.appendChild(li);
  });

  // TOC filter.
  document.getElementById('tocFilter').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    tocList.querySelectorAll('li').forEach(li => {
      li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  // Active section highlighting.
  const links = {};
  tocList.querySelectorAll('a').forEach(a => { links[a.getAttribute('href').slice(1)] = a; });
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting && links[en.target.id]) {
        Object.values(links).forEach(l => l.classList.remove('active'));
        links[en.target.id].classList.add('active');
      }
    });
  }, { rootMargin: '-60px 0px -70% 0px' });
  content.querySelectorAll('h2, h3').forEach(h => obs.observe(h));

  // Mobile menu.
  const toc = document.getElementById('toc');
  document.getElementById('menuBtn').addEventListener('click', () => toc.classList.toggle('open'));
  tocList.addEventListener('click', e => { if (e.target.tagName === 'A') toc.classList.remove('open'); });

  // Back to top.
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => { toTop.style.display = window.scrollY > 600 ? 'block' : 'none'; });
  toTop.addEventListener('click', () => window.scrollTo({ top: 0 }));

  // Mermaid rendering (re-rendered on theme change).
  async function renderDiagrams() {
    content.querySelectorAll('pre.mermaid').forEach(el => {
      el.removeAttribute('data-processed');
      el.innerHTML = escapeHtml(diagrams[+el.dataset.idx]);
    });
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'default', securityLevel: 'strict',
                         flowchart: { htmlLabels: true, useMaxWidth: true } });
    try { await mermaid.run({ querySelector: 'pre.mermaid' }); } catch (e) { console.error(e); }
  }
  renderDiagrams();

  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('csg-theme', next); } catch (e) {}
    renderDiagrams();
  });

  if (location.hash) {
    const t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t) setTimeout(() => t.scrollIntoView(), 50);
  }
})();
</script>
</body>
</html>
